<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Conquest Run — Demo PWA</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0f19"/>
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root {
    --bg: #f9fafb;
    --text: #111827;
    --card: #ffffff;
    --muted: #6b7280;
    --border: #e5e7eb;
    --hover: #f3f4f6;
  }
  .dark {
    --bg: #0b0f19;
    --text: #e5e7eb;
    --card: #0f172a;
    --muted: #cbd5e1;
    --border: #1f2937;
    --hover: #0b1221;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif;
         background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  header { max-width: 1100px; margin: 32px auto 16px; padding: 0 20px; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  .muted { color: var(--muted); font-size: 14px; }
  main { max-width: 1100px; margin: 0 auto; padding: 0 20px 96px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .grid-4 { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
  .grid-8 { display:grid; grid-template-columns: repeat(8, minmax(0,1fr)); gap: 6px; }
  .btn { border: 1px solid var(--border); background: transparent; padding: 8px 12px; border-radius: 12px; cursor: pointer; color: var(--text); }
  .btn:hover { background: var(--hover); }
  .pill { border-radius: 999px; padding: 6px 12px; display:inline-block; border: 1px solid var(--border); cursor:pointer; }
  .pill.active { background: #111827; color: #fff; border-color:#111827; }
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; border-top: 1px solid var(--border); backdrop-filter: blur(8px);
          background: rgba(255,255,255,0.85); }
  .dark .tabs { background: rgba(15, 23, 42, 0.85); }
  .tabs-inner { max-width: 1100px; margin: 0 auto; display:grid; grid-template-columns: repeat(5, 1fr); }
  .tab-btn { display:flex; flex-direction:column; align-items:center; gap:2px; padding: 10px 0; cursor:pointer; border: 0; background:transparent; color: var(--text); }
  .tab-btn.active { background: #111827; color: #fff; }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0);} }
  .input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: rgba(255,255,255,.9); color: var(--text); }
  .badge { position:absolute; top:-6px; right:-6px; background:#065f46; color:#fff; font-size:10px; padding:2px 6px; border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .hex { height: 40px; border-radius: 8px; border: 1px solid var(--border); position:relative; }
  .hex.you { background: #86efac; border-color:#4ade80; }
  .hex.enemy { background: #fca5a5; border-color:#f87171; }
  .hex.neutral { background: #e5e7eb; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .team-dot { width: 36px; height: 36px; border-radius: 999px; }
  .dot-green { background:#22c55e; } .dot-blue { background:#3b82f6; } .dot-red { background:#ef4444; }
  details { border-radius: 12px; border: 1px solid var(--border); padding: 10px 12px; background: rgba(255,255,255,.9); }
  .dark .pill.active { background:#e5e7eb; color:#111827; border-color:#e5e7eb; }
  .dark .tab-btn.active { background:#e5e7eb; color:#111827; }
</style>
</head>
<body>
  <header>
    <div class="row">
      <div>
        <h1>Conquest Run — Demo PWA</h1>
        <div class="muted">PWA • Offline Ready • Tabs + Equipes + Eventos • Delay de defesa</div>
      </div>
      <button id="toggleDark" class="btn" title="Alternar tema">🌙/☀️ Modo</button>
    </div>
  </header>

  <main>
    <div id="view" class="fade"></div>
  </main>

  <nav class="tabs">
    <div class="tabs-inner">
      <button class="tab-btn active" data-tab="home">🏠<span style="font-size:11px">Início</span></button>
      <button class="tab-btn" data-tab="profile">👤<span style="font-size:11px">Perfil</span></button>
      <button class="tab-btn" data-tab="ranking">🏆<span style="font-size:11px">Ranking</span></button>
      <button class="tab-btn" data-tab="badges">⭐<span style="font-size:11px">Insígnias</span></button>
      <button class="tab-btn" data-tab="teams">👥<span style="font-size:11px">Equipes</span></button>
    </div>
  </nav>

<script>
// Registrar service worker para cache offline e instalabilidade
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}

(function(){
  // Estado simples
  let currentTab = 'home';
  let teamsTab = 'list';
  const root = document.getElementById('view');

  // Dark mode
  document.getElementById('toggleDark').addEventListener('click', ()=>{
    document.documentElement.classList.toggle('dark');
  });

  // Tabs
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      render();
    });
  });

  // Helpers
  function card(html){ return '<div class="card fade">'+html+'</div>'; }
  function pills(items, active, onClickName){
    return '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">'
      + items.map(n=>'<span class="pill '+(active===n?'active':'')+'" data-click="'+onClickName+':'+n+'">'+n+'</span>').join('')
      + '</div>';
  }

  function renderHome(){
    const grid = Array.from({length:64}).map((_,i)=>{
      const you = i%7===0, enemy=!you && i%5===0;
      const defended = you && (i%2===0);
      const delay = defended ? (i%4===0?'2h':(i%3===0?'45m':'1h')) : '';
      const cls = you? 'you' : enemy? 'enemy' : 'neutral';
      return '<div class="hex '+cls+'">'+(defended?'<div class="badge">🛡️ '+delay+'</div>':'')+'</div>';
    }).join('');
    return card(`
      <div class="row" style="margin-bottom:12px">
        <input class="input" placeholder="🔍 Pesquisar região"/>
        <span class="muted">Zoom: pinça com os dedos</span>
      </div>
      <div class="grid-8">${grid}</div>
      <div class="muted" style="font-size:12px;margin-top:8px">Verde = seu controle • Vermelho = inimigo • Cinza = neutro • 🛡️ = delay de defesa</div>
      <details style="margin-top:12px"><summary>❓ Tutorial rápido</summary>
        <ol style="margin:8px 0 0 20px; font-size:14px">
          <li>Use pinça para dar zoom.</li>
          <li>Caminhe sobre um hex para conquistar.</li>
          <li>Visitas frequentes geram delay de defesa.</li>
          <li>Entre em Equipes para Eventos & Desafios.</li>
        </ol>
      </details>
    `);
  }

  function renderProfile(){
    return card(`
      <h2 style="margin:0 0 8px;font-size:20px">Perfil</h2>
      <div style="text-align:center;margin-bottom:8px">
        <div style="font-size:44px">👤</div>
        <div style="font-weight:600">PlayerXYZ</div>
        <div class="muted">Modalidade: Intermediário N3</div>
      </div>
      <div class="grid-4">
        <div class="card" style="text-align:center">🛡️ 120 Hexágonos</div>
        <div class="card" style="text-align:center">🏅 8 Insígnias</div>
      </div>
    `);
  }

  function renderRanking(){
    return card(`
      <h2 style="margin:0 0 8px;font-size:20px">Ranking</h2>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <span class="pill active">Individual</span><span class="pill">Equipes</span>
      </div>
      <ul style="margin:0;padding-left:18px;line-height:1.8">
        <li>🥇 João — 450 hexágonos</li>
        <li>🥈 Maria — 420 hexágonos</li>
        <li>🥉 Carlos — 380 hexágonos</li>
        <li>… Você está em: #14 (250 hexágonos)</li>
      </ul>
    `);
  }

  function renderBadges(){
    return card(`
      <h2 style="margin:0 0 8px;font-size:20px">Insígnias</h2>
      <div class="grid-4">
        <div class="card" style="text-align:center">✔ Exploração<br/>100 hex</div>
        <div class="card" style="text-align:center">✔ Resistência<br/>100 km/sem</div>
        <div class="card" style="text-align:center; opacity:.6">⬜ Dominador<br/>60% área</div>
        <div class="card" style="text-align:center; opacity:.6">⬜ Persistência<br/>7 dias</div>
      </div>
    `);
  }

  function renderTeams(){
    let content = '';
    if (teamsTab === 'list') {
      content = `
        ${[
          {name:'Green Hawks', color:'Verde', dot:'dot-green', score:'12.450'},
          {name:'Blue Wolves', color:'Azul', dot:'dot-blue', score:'11.880'},
          {name:'Red Foxes', color:'Vermelho', dot:'dot-red', score:'10.320'}
        ].map(t=>`
          <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px">
            <div style="display:flex;align-items:center;gap:10px">
              <div class="team-dot ${t.dot}"></div>
              <div>
                <div style="font-weight:600">${t.name}</div>
                <div class="muted" style="font-size:13px">Cor no mapa: ${t.color}</div>
              </div>
            </div>
            <div class="muted" style="font-size:13px">Pontuação: ${t.score}</div>
          </div>
        `).join('')}
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn">Criar equipe</button>
          <button class="btn">Entrar em equipe</button>
        </div>
      `;
    } else if (teamsTab === 'ranking') {
      content = `
        <ul style="margin:0;padding-left:18px;line-height:1.8">
          <li>🥇 Green Hawks — 12.450 pts</li>
          <li>🥈 Blue Wolves — 11.880 pts</li>
          <li>🥉 Red Foxes — 10.320 pts</li>
        </ul>
      `;
    } else {
      // Eventos com localizações atualizadas
      content = `
        ${[
          {when:'Sáb, 13 Set • 09:00–12:00', title:'Conquista Regional – Santos', desc:'Domine o maior número de hexágonos em 3 horas. Pontos em dobro nas bordas.'},
          {when:'Dom, 28 Set • 08:00–20:00', title:'Defesa Coletiva – Anhangabaú', desc:'Mantenha 50 hexágonos ativos por 12h. Bônus de defesa no perímetro.'},
          {when:'Sáb, 04 Out • 10:00–16:00', title:'Expansão Territorial – Rio de Janeiro', desc:'Abra novas áreas em cooperação. Meta compartilhada.'}
        ].map(ev=>`
          <div class="card">
            <div class="muted" style="font-size:12px">${ev.when}</div>
            <div style="font-weight:600">${ev.title}</div>
            <div style="font-size:14px;margin:4px 0 8px">${ev.desc}</div>
            <div style="display:flex;gap:8px">
              <button class="btn">Participar</button>
              <button class="btn">Ver detalhes</button>
            </div>
          </div>
        `).join('')}
      `;
    }

    return card(`
      <h2 style="margin:0 0 8px;font-size:20px">Equipes</h2>
      ${pills(['list','ranking','events'], teamsTab, 'teamsTab')}
      <div class="fade">${content}</div>
    `);
  }

  function render(){
    let html = '';
    if (currentTab === 'home') html = renderHome();
    else if (currentTab === 'profile') html = renderProfile();
    else if (currentTab === 'ranking') html = renderRanking();
    else if (currentTab === 'badges') html = renderBadges();
    else html = renderTeams();

    root.innerHTML = html;

    // Clique nas pills
    root.querySelectorAll('[data-click]').forEach(el=>{
      const [k, v] = el.getAttribute('data-click').split(':');
      el.addEventListener('click', ()=>{
        if (k === 'teamsTab') { teamsTab = v; render(); }
      });
    });
  }

  render();
})();</script>
</body>
</html>
